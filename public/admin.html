<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Write — Simple Blog</title><link rel="stylesheet" href="/css/style.css"></head><body><header class="site-header"><div class="container nav"><a class="brand" href="/">Simple Blog</a><nav><a href="/">Home</a><button id="logoutButton" class="link-button">Logout</button></nav></div></header><main class="container admin-page"><section class="composer"><div class="composer-header"><div class="avatar">A</div><div><strong id="welcomeName">Author</strong><span>Create or edit a post</span></div></div><form id="postForm"><input id="title" maxlength="200" placeholder="Post title" required><div class="editor-toolbar"><button type="button" data-wrap="**">Bold</button><button type="button" data-wrap="*">Italic</button><button type="button" data-prefix="## ">Heading</button><button type="button" data-prefix="- ">List</button><button type="button" id="linkButton">Link</button></div><textarea id="body" maxlength="20000" rows="12" placeholder="What's on your mind?" required></textarea><div class="image-row"><label>Cover image <input id="coverImage" type="file" accept="image/jpeg,image/png,image/webp,image/gif"></label><span id="uploadStatus" class="muted"></span></div><img id="coverPreview" class="cover-preview hidden" alt="Cover preview"><input id="coverUrl" type="hidden"><div class="composer-footer"><select id="status"><option value="published">Published</option><option value="draft">Draft</option></select><div class="composer-buttons"><button id="previewButton" class="secondary-button" type="button">Preview</button><button id="cancelEditButton" class="secondary-button hidden" type="button">Cancel</button><button id="submitPostButton" class="primary-button" type="submit">Publish</button></div></div><p id="postMessage" class="message"></p></form></section><section><h2>Your posts</h2><div id="adminPosts" class="posts"></div></section></main><dialog id="postPreviewDialog" class="preview-dialog"><div class="preview-dialog-inner"><div class="preview-dialog-top"><strong>Post preview</strong><button id="closePreviewButton" class="secondary-button" type="button">Close</button></div><article id="postPreviewContent" class="preview-article"></article></div></dialog><script src="/js/markdown.js"></script><script src="/js/admin.js"></script></body></html>
